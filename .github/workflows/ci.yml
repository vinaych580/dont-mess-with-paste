name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Harness tests (Chromium and Firefox)
        run: npm test
      - name: Build
        shell: pwsh
        run: ./pack-extension.ps1 -OutputDir build -KeepUnpacked
      - name: Lint the Firefox build
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
