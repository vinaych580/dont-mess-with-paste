<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Don't Mess With Paste — Manage Sites</title>
  <style>
    body {
      max-width: 640px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    p.lead {
      color: #666;
      margin-top: 0;
    }
    .global-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f5f5f5;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    th {
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    td.host {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      word-break: break-all;
    }
    td.actions {
      text-align: right;
      white-space: nowrap;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .remove-btn {
      background: none;
      border: 1px solid #f44336;
      color: #f44336;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .remove-btn:hover {
      background: #f44336;
      color: #fff;
    }
    .empty {
      color: #888;
      padding: 24px 0;
      text-align: center;
    }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .clear-all-btn {
      background: none;
      border: 1px solid #ccc;
      color: #555;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
    }
    .clear-all-btn:hover {
      border-color: #999;
    }
  </style>
</head>
<body>
  <h1>Don't Mess With Paste</h1>
  <p class="lead">Manage per-site settings.</p>

  <div class="global-row">
    <span>Extension active on all sites</span>
    <label>
      <input type="checkbox" id="globalToggle" checked>
    </label>
  </div>

  <table id="sitesTable">
    <thead>
      <tr>
        <th>Site</th>
        <th>Enabled</th>
        <th>Force Mode</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="sitesBody"></tbody>
  </table>
  <div class="empty" id="emptyState" hidden>No sites configured yet — settings appear here once you toggle a site from the popup.</div>

  <div class="toolbar">
    <button class="clear-all-btn" id="clearAllBtn">Clear all site-specific settings</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
